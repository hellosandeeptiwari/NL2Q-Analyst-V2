# Azure App Service Configuration
# This file configures the startup command and runtime for Azure App Service

# Python version
python: "3.9"

# Startup command
startup-command: "python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4"

# Build commands
pre-build:
  - "pip install --upgrade pip"

post-build:
  - "echo 'Build completed successfully'"

# App settings (these should be set in Azure Portal or via CLI)
# DB_HOST
# DB_PORT
# DB_USER
# DB_PASSWORD
# DB_NAME
# OPENAI_API_KEY
# PINECONE_API_KEY
# PINECONE_ENVIRONMENT
# PINECONE_INDEX_NAME
